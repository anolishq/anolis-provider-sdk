name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: provider-sdk-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      cpp: ${{ steps.cppfilter.outputs.cpp }}
      docs: ${{ steps.docsfilter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!**/*.png'
              - '!**/*.svg'
      # Separate OR-filter (default quantifier) for the C++ sources the clang-tidy
      # gate lints, so it skips (and the ok gate stays green) on non-C++ PRs.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: cppfilter
        with:
          filters: |
            cpp:
              - '**/*.c'
              - '**/*.cc'
              - '**/*.cpp'
              - '**/*.cxx'
              - '**/*.h'
              - '**/*.hh'
              - '**/*.hpp'
              - '**/*.hxx'
              - '.clang-tidy'
      # The files the docs-check workflow lints, so the docs gate skips (and ok
      # stays green) on PRs that touch none of them.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: docsfilter
        with:
          filters: |
            docs:
              - 'docs/**'
              - '*.md'
              - '.markdownlint.jsonc'
              - '.github/workflows/ci.yml'

  docs:
    name: Docs
    needs: [changes]
    if: needs.changes.outputs.docs == 'true'
    uses: anolishq/.github/.github/workflows/docs-check.yml@7a3a0624c056ea20fcb901968c482f9ed2ffb818 # v2

  build-and-test-linux:
    name: Linux Build and Test
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout anolis-provider-sdk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: anolis-provider-sdk

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Setup vcpkg
        uses: anolishq/.github/.github/actions/setup-vcpkg@7a3a0624c056ea20fcb901968c482f9ed2ffb818 # v2.8
        with:
          triplet: x64-linux-static

      - name: Configure
        working-directory: anolis-provider-sdk
        run: cmake --preset ci-linux-release

      - name: Build
        working-directory: anolis-provider-sdk
        run: cmake --build --preset ci-linux-release --parallel

      - name: Test
        working-directory: anolis-provider-sdk
        run: ctest --preset ci-linux-release

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Pull anolis-protocol[conformance]
        run: python -m pip install "anolis-protocol[conformance] @ https://github.com/anolishq/anolis-protocol/releases/download/v1.10.0/anolis_protocol-1.10.0-py3-none-any.whl"

      # The reference provider under the harness: an SDK change that breaks the
      # protocol fails here, not later in a provider's CI. No failures; the only
      # skips allowed are the two deadline tests, until #71 lands.
      - name: Conformance against the reference provider
        working-directory: anolis-provider-sdk
        run: |
          anolis-adpp-conformance \
            --provider-bin build/ci-linux-release/examples/reference/anolis-provider-reference \
            --provider-config config/conformance.yaml \
            --provider-profile config/conformance.toml \
            --junitxml=conformance.xml -ra
          python3 - conformance.xml <<'EOF'
          import sys
          import xml.etree.ElementTree as ET
          expected = {"test_l2_expired_deadline_exceeded", "test_l2_malformed_deadline_is_invalid_argument"}
          skipped = {c.get("name") for c in ET.parse(sys.argv[1]).iter("testcase") if c.find("skipped") is not None}
          unexpected = skipped - expected
          if unexpected:
              sys.exit(f"unexpected skips: {sorted(unexpected)}")
          print(f"skips: {sorted(skipped)} (allowed until #71)")
          EOF

  build-and-test-windows:
    name: Windows Build and Test
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Checkout anolis-provider-sdk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: anolis-provider-sdk

      - name: Setup vcpkg
        uses: anolishq/.github/.github/actions/setup-vcpkg@7a3a0624c056ea20fcb901968c482f9ed2ffb818 # v2.8
        with:
          triplet: x64-windows

      - name: Configure
        working-directory: anolis-provider-sdk
        shell: pwsh
        run: cmake --preset ci-windows-release

      - name: Build
        working-directory: anolis-provider-sdk
        shell: pwsh
        run: cmake --build --preset ci-windows-release --parallel

      - name: Test
        working-directory: anolis-provider-sdk
        shell: pwsh
        run: ctest --preset ci-windows-release

  version-sync:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    uses: anolishq/.github/.github/workflows/version-sync.yml@7a3a0624c056ea20fcb901968c482f9ed2ffb818 # v2
    with:
      python-version: '3.12'
      working-directory: '.'

  cpp-format:
    name: C++ Formatting (clang-format)
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout anolis-provider-sdk
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned clang-tools
        # SHA-verified static LLVM 18.1.8 clang-format on PATH — the org source of
        # truth; install the same pinned binary on dev boxes to match CI. See
        # anolishq/.github#69.
        uses: anolishq/.github/.github/actions/setup-clang-tools@9869a5f4bee7da9c7c1dc9bae033cd0137c4801d # setup-clang-tools
      - name: Check formatting
        run: git ls-files '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' | xargs clang-format --dry-run --Werror

  clang-tidy:
    name: Clang-Tidy (changed lines)
    needs: [changes]
    if: needs.changes.outputs.cpp == 'true'
    permissions:
      contents: read
    uses: anolishq/.github/.github/workflows/clang-tidy-diff.yml@7a3a0624c056ea20fcb901968c482f9ed2ffb818 # clang-tidy-diff
    with:
      configure-preset: ci-linux-release
      blocking: true

  ok:
    name: ok
    if: always()
    needs:
      - changes
      - build-and-test-linux
      - build-and-test-windows
      - cpp-format
      - clang-tidy
      - version-sync
      - docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate job results
        run: |
          echo "Job results: ${{ toJSON(needs.*.result) }}"
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
